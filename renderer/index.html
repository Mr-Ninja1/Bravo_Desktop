<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checklist Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <div id="splashContent">
          <div id="logoContainer">
            <img id="logo" src="../assets/logo.jpeg" alt="logo" />
          </div>
          <h1 id="bravo">Bravo!</h1>
          <p id="subtitle">ADMIN DASHBOARD</p>
          <div id="spinner" class="spinner"></div>
          <p id="loadingMsg">Starting app</p>
        </div>
      </div>

      <div id="main" style="display:none">
        <header class="topbar" id="customTitlebar">
          <div class="left">
            <!-- hamburger removed: not used -->
            <img id="logoSmall" src="../assets/logo.jpeg" alt="logo" />
          </div>
          <!-- Centered app title (visual only) -->
          <div class="topbar-center">
            <h2 id="centerAppTitle">BRAVO FOOD SAFETY MANAGEMENT ADMIN DASHBOARD</h2>
          </div>
          <div class="right">
            <div id="userInfo" class="userInfo" style="display:none">
              <img id="userAvatar" src="" alt="avatar" />
              <div class="userText"><div id="userName"></div><div id="userEmail" class="small"></div></div>
            </div>
            <!-- Compact window controls appear in the top row -->
            <div id="windowControls" class="window-controls">
              <button id="winMin" class="window-btn" title="Minimize" aria-label="Minimize">
                <span class="icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="11" width="16" height="2" rx="1"/></svg>
                </span>
              </button>
              <button id="winMax" class="window-btn" title="Maximize" aria-label="Maximize">
                <span class="icon">
                  <svg class="icon-normal" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
                  <svg class="icon-max" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 9h10V3h8v16h-8v6H3V9zm2 2v8h6v-6H5z"/></svg>
                </span>
              </button>
              <button id="winClose" class="window-btn close" title="Close" aria-label="Close">
                <span class="icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.3 5.3l12.4 12.4-1.4 1.4L4.9 6.7z"/><path d="M18.7 5.3L6.3 17.7l1.4 1.4L20.1 6.7z"/></svg>
                </span>
              </button>
            </div>
          </div>
        </header>
        <!-- Update banner (populated by renderer UpdateNotifier) -->
        <div id="updateBanner" style="position:relative;z-index:60"></div>
        <!-- Controls row below the titlebar: minimal container with Refresh (no bordered wrapper) -->
        <div class="controlsBar">
          <div id="controls" style="max-width:1200px;width:100%;display:flex;align-items:center;justify-content:flex-end;gap:12px;">
            <div id="extraCardsArea" class="extra-cards-area" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
              <div class="statsRowExtra" style="display:flex;gap:16px;align-items:center;pointer-events:auto">
                <div class="statCard small userCard">
                  <div style="display:flex;gap:12px;align-items:center;width:100%">
                    <img class="cardBadge" src="../assets/image.png" style="display:block" />
                    <img class="statAvatar" src="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.06)">
                    <div style="flex:1;min-width:0">
                      <div class="statHeader">Connected as</div>
                      <div class="statValue smallName">Not signed in</div>
                      <div class="statLabel smallMuted">—</div>
                    </div>
                  </div>
                </div>
                <div class="statCard small storageCard">
                  <div style="width:100%">
                    <img class="cardBadge" src="../assets/image.png" style="display:block" />
                    <div class="statHeader">Dropbox storage</div>
                    <div class="statValue storageNumbers">Unknown</div>
                    <div class="storageProgress" style="width:100%;max-width:200px;height:12px;background:rgba(255,255,255,0.06);border-radius:8px;overflow:hidden;margin-top:8px">
                      <div class="storageFill" style="width:0%;height:100%;background:linear-gradient(90deg,#1ea7ff,#6f5cff)"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="controls-right">
              <button id="refreshList">Refresh</button>
            </div>
          </div>
        </div>

        <!-- footer moved below the app container to reserve bottom space -->

        <main>
          <div id="yearRow" style="margin-bottom:12px;padding:8px;display:flex;gap:8px;overflow-x:auto"></div>
          <div id="yearSidebar">
              <!-- Sidebar heading + Year cards and local list will be rendered here dynamically -->
              <div id="sidebarHeader" class="sidebarHeading">Your Dropbox forms</div>
              <!-- Year cards and local list will be rendered here dynamically -->
              <div id="localList" style="margin-top:12px">
                <!-- Restored/local forms will be rendered here as cards grouped by date -->
              </div>
          </div>
            <div id="displayContainer">
            <div id="watermark" aria-hidden="true"></div>
            
          </div>
        </main>
      </div>
    </div>
    </div>

    <script src="dist/bundle.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
