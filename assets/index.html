<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checklist Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <div id="splashContent">
          <div id="logoContainer">
            <img id="logo" src="../assets/logo.jpeg" alt="logo" />
          </div>
          <h1 id="bravo">Bravo!</h1>
          <p id="subtitle">Desktop Forms Manager</p>
          <div id="spinner" class="spinner"></div>
          <p id="loadingMsg">Starting app</p>
        </div>
      </div>

      <div id="main" style="display:none">
        <header class="topbar">
          <div class="left">
            <!-- hamburger removed: not used -->
            <img id="logoSmall" src="../assets/logo.jpeg" alt="logo" />
            <h2>Saved Forms</h2>
          </div>
          <div class="right">
            <div id="userInfo" class="userInfo" style="display:none">
              <img id="userAvatar" src="" alt="avatar" />
              <div class="userText"><div id="userName"></div><div id="userEmail" class="small"></div></div>
            </div>
            <div id="controls" class="controls-visible">
              <input id="searchInput" placeholder="Search saved forms (name)..." />
              <select id="yearSelect"><option value="all">All years</option></select>
              <select id="monthSelect"><option value="all">All months</option></select>
              <button id="refreshList">Refresh</button>
            </div>
          </div>
        </header>

        <main>
          <div id="yearRow" style="margin-bottom:12px;padding:8px;display:flex;gap:8px;overflow-x:auto"></div>
          <div id="listPane">
            <div id="yearSidebar">
                <!-- Sidebar heading + Year cards will be rendered here -->
                <div id="sidebarHeader" class="sidebarHeading">Your Dropbox forms</div>
                <!-- Year cards will be rendered here -->
              </div>
            <div id="localList">
              <!-- Restored/local forms will be rendered here as cards grouped by date -->
            </div>
          </div>
          <div id="displayContainer">
            <div id="watermark" aria-hidden="true"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="dist/bundle.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
